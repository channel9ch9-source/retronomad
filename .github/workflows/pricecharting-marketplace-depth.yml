name: Check PriceCharting PAL Marketplace depth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depth-check:
    if: ${{ vars.PRICECHARTING_REAL_BENCHMARK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run fixture/aggregate regression tests
        run: npm test

      - name: Require private PriceCharting token
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        shell: bash
        run: |
          test -n "$PRICECHARTING_TOKEN" || {
            echo "PRICECHARTING_TOKEN secret is not configured."
            exit 1
          }

      - name: Probe available offers across PAL console categories
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: node scripts/pricecharting-marketplace-depth.mjs --out=benchmarks/pricecharting-marketplace-depth.json

      - name: Publish aggregate diagnostic only
        uses: actions/upload-artifact@v7
        with:
          name: pricecharting-pal-marketplace-depth
          path: benchmarks/pricecharting-marketplace-depth.json
          if-no-files-found: error
          retention-days: 14
