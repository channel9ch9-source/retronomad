name: Benchmark full catalogue search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Build fresh IGDB dry-import candidate
        env:
          IGDB_CLIENT_ID: \${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: \${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/igdb-dry-import.mjs

      - name: Resolve candidate path
        shell: bash
        run: |
          CANDIDATE="$(ls -1 benchmarks/igdb-dry-import-proposed-*.json | head -n 1)"
          test -n "$CANDIDATE"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"

      - name: Benchmark 8,433-game search
        run: node scripts/benchmark-catalogue-search.mjs --input="$CANDIDATE" --output=benchmarks/full-catalogue-search-benchmark.json --markdown=benchmarks/full-catalogue-search-benchmark.md

      - name: Upload search benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-catalogue-search-benchmark
          path: |
            benchmarks/full-catalogue-search-benchmark.json
            benchmarks/full-catalogue-search-benchmark.md
          if-no-files-found: warn
          retention-days: 30
