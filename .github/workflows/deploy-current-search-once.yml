name: Deploy current 100-game ranked search once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Deploy current 100-game ranked search' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install deployment tooling
        run: npm install

      - name: Assert publication gate stays closed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const catalogue=JSON.parse(fs.readFileSync("catalogue/base-catalogue.json","utf8"));
          if(catalogue.games.length!==100){
            throw new Error("Refusing deployment: canonical catalogue must remain exactly 100 games, got "+catalogue.games.length);
          }
          const nonDeep=catalogue.games.filter(g=>g.releaseIntelligence?.coverage!=="PALSCOUT_DEEP");
          if(nonDeep.length){
            throw new Error("Refusing deployment: current production catalogue contains non-PALSCOUT_DEEP records");
          }
          console.log("Publication gate verified: 100 PALScout deep games only.");
          NODE

      - name: Run regression tests
        run: npm test

      - name: Build same-origin static assets
        run: npm run build:cloudflare

      - name: Verify ranked Search bundle
        shell: bash
        run: |
          test -f dist/public/shared/catalogue-search-core.js
          grep -q "catalogueSuggestions" dist/public/search.html
          grep -q "rankCatalogueMatches" dist/public/search.html
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const js=fs.readFileSync("dist/public/catalogue-index.js","utf8");
          const count=(js.match(/"id":/g)||[]).length;
          if(count!==100)throw new Error("Refusing deployment: built browser index has "+count+" games");
          console.log("Built browser index verified at 100 games.");
          NODE

      - name: Resolve/create D1 and render Wrangler config
        run: npm run prepare:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_EMAIL_WEBHOOK_URL: ${{ secrets.AUTH_EMAIL_WEBHOOK_URL }}

      - name: Apply D1 migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Resend API key
        if: env.RESEND_API_KEY != ''
        shell: bash
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config .wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Configure optional email webhook secret
        if: env.AUTH_EMAIL_WEBHOOK_SECRET != ''
        shell: bash
        run: printf '%s' "$AUTH_EMAIL_WEBHOOK_SECRET" | npx wrangler secret put AUTH_EMAIL_WEBHOOK_SECRET --config .wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_WEBHOOK_SECRET: ${{ secrets.AUTH_EMAIL_WEBHOOK_SECRET }}

      - name: Deploy Worker + current 100-game static app
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
