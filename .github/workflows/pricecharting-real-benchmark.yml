name: Run PriceCharting real benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode
        required: true
        default: both
        type: choice
        options:
          - pricing
          - offers
          - both

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ vars.PRICECHARTING_REAL_BENCHMARK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests first
        run: npm test

      - name: Require server-side PriceCharting token
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        shell: bash
        run: |
          test -n "$PRICECHARTING_TOKEN" || {
            echo "PRICECHARTING_TOKEN secret is not configured."
            exit 1
          }

      - name: Run real pricing benchmark
        if: ${{ inputs.mode == 'pricing' || inputs.mode == 'both' }}
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: node scripts/pricecharting-benchmark.mjs --mode=pricing --out=benchmarks/pricecharting-real-pricing.json

      - name: Run real Marketplace offer benchmark
        if: ${{ inputs.mode == 'offers' || inputs.mode == 'both' }}
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: node scripts/pricecharting-benchmark.mjs --mode=offers --out=benchmarks/pricecharting-real-offers.json

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricecharting-real-benchmark
          path: |
            benchmarks/pricecharting-real-pricing.json
            benchmarks/pricecharting-real-offers.json
          if-no-files-found: warn
          retention-days: 30
