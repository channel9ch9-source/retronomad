name: Validate catalogue promotion pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install tooling
        run: npm install

      - name: Run regression tests
        run: npm test

      - name: Build fresh IGDB dry-import candidate
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/igdb-dry-import.mjs

      - name: Resolve candidate path
        shell: bash
        run: |
          CANDIDATE="$(ls -1 benchmarks/igdb-dry-import-proposed-*.json | head -n 1)"
          test -n "$CANDIDATE"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"

      - name: Validate candidate
        run: node scripts/validate-catalogue-promotion.mjs --input="$CANDIDATE"

      - name: Prepare promotion candidate
        run: node scripts/prepare-catalogue-promotion.mjs --input="$CANDIDATE" --out-dir=promotion-output

      - name: Export versioned D1 staging files
        run: node scripts/export-catalogue-d1.mjs --input=promotion-output/canonical-candidate.json --manifest=promotion-output/manifest.json --out-dir=promotion-output/d1

      - name: Initialize isolated local D1
        run: npx wrangler d1 execute DB --local --config wrangler.catalogue-test.jsonc --file=backend/schema.sql --persist-to=.catalogue-d1-test

      - name: Stage candidate into isolated local D1
        shell: bash
        run: |
          for f in $(find promotion-output/d1 -maxdepth 1 -type f -name '[0-8][0-9]-*.sql' | sort); do
            echo "Loading $f"
            npx wrangler d1 execute DB --local --config wrangler.catalogue-test.jsonc --file="$f" --persist-to=.catalogue-d1-test
          done

      - name: Verify staged dataset
        run: node scripts/verify-d1-catalogue.mjs --manifest=promotion-output/manifest.json --local --config=wrangler.catalogue-test.jsonc --persist-to=.catalogue-d1-test

      - name: Activate dataset locally
        env:
          CATALOGUE_PROMOTION_CONFIRM: LOCAL_TEST
        run: node scripts/activate-catalogue-dataset.mjs --manifest=promotion-output/manifest.json --local --config=wrangler.catalogue-test.jsonc --persist-to=.catalogue-d1-test

      - name: Verify active pointer
        run: node scripts/verify-d1-catalogue.mjs --manifest=promotion-output/manifest.json --local --expect-active --config=wrangler.catalogue-test.jsonc --persist-to=.catalogue-d1-test

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-promotion-pipeline-validation
          path: |
            promotion-output/manifest.json
            promotion-output/d1/export-summary.json
            promotion-output/activation-result.json
          if-no-files-found: warn
          retention-days: 30
