name: Deploy dormant artwork slots once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'Deploy dormant artwork slots' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOGUE_ARTWORK_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install deployment tooling
        run: npm install

      - name: Assert publication gates stay closed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const catalogue=JSON.parse(fs.readFileSync("catalogue/base-catalogue.json","utf8"));
          if(catalogue.games.length!==100) throw new Error("Expected exactly 100 public games");
          if(catalogue.games.some(g=>g.releaseIntelligence?.coverage!=="PALSCOUT_DEEP")) throw new Error("Public catalogue contains non-deep records");
          if(catalogue.games.some(g=>g.artwork!=null)) throw new Error("Current public seed unexpectedly contains artwork");
          if(String(process.env.CATALOGUE_ARTWORK_ENABLED).toLowerCase()!=="false") throw new Error("Artwork flag must be false for this deployment");
          console.log("Publication gates verified: 100 PALScout-deep games, zero artwork records, artwork flag off.");
          NODE

      - name: Run regression tests
        run: npm test

      - name: Build Cloudflare static assets with artwork disabled
        run: npm run build:cloudflare

      - name: Verify dormant artwork bundle
        shell: bash
        run: |
          grep -q 'id="detailArtwork"' dist/public/catalogue.html
          grep -q 'id="heroArtImage"' dist/public/search.html
          grep -q 'catalogueArtworkEnabled: false' dist/public/runtime-config.js
          if grep -q '"artwork":' dist/public/catalogue-index.js; then
            echo "Artwork payload leaked into public catalogue index"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const index=fs.readFileSync("dist/public/catalogue-index.js","utf8");
          const count=(index.match(/"id":/g)||[]).length;
          if(count!==100) throw new Error("Built index count changed: "+count);
          console.log("Dormant artwork bundle verified with 100-game art-free public index.");
          NODE

      - name: Resolve D1 and render Wrangler config
        run: npm run prepare:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_EMAIL_WEBHOOK_URL: ${{ secrets.AUTH_EMAIL_WEBHOOK_URL }}

      - name: Deploy Worker + dormant artwork slots
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
