name: Deploy Catalogue v1 once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'Deploy guarded Catalogue v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install deployment tooling
        run: npm install

      - name: Assert IGDB publication gate stays closed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const catalogue=JSON.parse(fs.readFileSync("catalogue/base-catalogue.json","utf8"));
          if(catalogue.games.length!==100){
            throw new Error("Refusing deployment: expected exactly 100 public games, got "+catalogue.games.length);
          }
          const nonDeep=catalogue.games.filter(g=>g.releaseIntelligence?.coverage!=="PALSCOUT_DEEP");
          if(nonDeep.length){
            throw new Error("Refusing deployment: public catalogue contains non-PALSCOUT_DEEP records");
          }
          console.log("Publication gate verified: 100 PALScout-deep games only.");
          NODE

      - name: Run regression tests
        run: npm test

      - name: Build Cloudflare static assets
        run: npm run build:cloudflare

      - name: Verify Catalogue v1 production bundle
        shell: bash
        run: |
          test -f dist/public/catalogue.html
          grep -q 'id="catalogueGrid"' dist/public/catalogue.html
          grep -q 'const PAGE_SIZE=36' dist/public/catalogue.html
          grep -q 'search.html?game=' dist/public/catalogue.html
          grep -q 'catalogueId:canonical?.id||null' dist/public/search.html
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const index=fs.readFileSync("dist/public/catalogue-index.js","utf8");
          const count=(index.match(/"id":/g)||[]).length;
          if(count!==100)throw new Error("Refusing deployment: built catalogue index has "+count+" games");
          console.log("Catalogue bundle verified with 100-game browser index.");
          NODE

      - name: Resolve D1 and render Wrangler config
        run: npm run prepare:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          AUTH_EMAIL_WEBHOOK_URL: ${{ secrets.AUTH_EMAIL_WEBHOOK_URL }}

      - name: Deploy Worker + Catalogue v1
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
