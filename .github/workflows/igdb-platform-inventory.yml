name: Run IGDB platform inventory benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Build read-only IGDB platform inventory
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/igdb-platform-inventory.mjs

      - name: Upload inventory benchmark
        uses: actions/upload-artifact@v7
        with:
          name: igdb-platform-inventory
          path: benchmarks/igdb-platform-inventory-*.json
          if-no-files-found: error
          retention-days: 30
