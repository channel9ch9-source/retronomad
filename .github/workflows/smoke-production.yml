name: Smoke test GrailRaven production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify live production domain
        run: node scripts/smoke-production.mjs
        env:
          PRODUCTION_ORIGIN: https://grailraven.com
          PRODUCTION_WWW_ORIGIN: https://www.grailraven.com
