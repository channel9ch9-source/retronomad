name: Check PriceCharting US game-specific offers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ vars.PRICECHARTING_REAL_BENCHMARK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify offline tests
        run: npm test

      - name: Require existing private PriceCharting token
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        shell: bash
        run: |
          test -n "$PRICECHARTING_TOKEN" || {
            echo "PRICECHARTING_TOKEN secret missing"
            exit 1
          }

      - name: Probe US game-specific available offers
        env:
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
        run: node scripts/pricecharting-us-game-hunts.mjs --out=benchmarks/pricecharting-us-game-offers.json

      - name: Upload counts-only report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricecharting-us-game-offer-benchmark
          path: benchmarks/pricecharting-us-game-offers.json
          if-no-files-found: warn
          retention-days: 14
