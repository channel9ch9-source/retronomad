name: Diagnose live GrailRaven once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.head_commit.message == 'Diagnose live GrailRaven' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS diagnostics
        shell: bash
        run: |
          set +e
          echo "=== UTC ==="
          date -u
          echo "=== grailraven.com DNS ==="
          dig +short A grailraven.com
          dig +short AAAA grailraven.com
          dig +short CNAME grailraven.com
          dig +short NS grailraven.com
          echo "=== www DNS ==="
          dig +short A www.grailraven.com
          dig +short AAAA www.grailraven.com
          dig +short CNAME www.grailraven.com
          echo "=== workers.dev DNS ==="
          dig +short A retronomad-app.channel9ch9.workers.dev
          dig +short AAAA retronomad-app.channel9ch9.workers.dev

      - name: HTTP diagnostics
        shell: bash
        run: |
          set +e
          for url in             https://grailraven.com/             https://grailraven.com/search.html             https://www.grailraven.com/             https://retronomad-app.channel9ch9.workers.dev/             https://retronomad-app.channel9ch9.workers.dev/health
          do
            echo "===== $url ====="
            curl -sS -o /tmp/body -D /tmp/headers --max-time 20 -w 'http_code=%{http_code}\nremote_ip=%{remote_ip}\ntime_total=%{time_total}\nurl_effective=%{url_effective}\n' "$url"
            echo "--- headers ---"
            cat /tmp/headers
            echo "--- body prefix ---"
            head -c 500 /tmp/body
            echo
          done

      - name: Cloudflare Worker deployment status
        shell: bash
        run: |
          npm install wrangler@4.149.0
          npx wrangler deployments list --name retronomad-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
