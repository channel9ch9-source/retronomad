name: Run IGDB dedup filtering benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Run read-only dedup/filter benchmark
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/igdb-dedup-filter-benchmark.mjs

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: igdb-dedup-filter-benchmark
          path: benchmarks/igdb-dedup-filter-*.json
          if-no-files-found: error
          retention-days: 30
