name: Run IGDB full catalogue dry import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run regression tests
        run: npm test

      - name: Build proposed catalogue without modifying canonical data
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/igdb-dry-import.mjs

      - name: Validate promotion candidate
        run: node scripts/validate-catalogue-promotion.mjs --input=benchmarks/igdb-dry-import-proposed-$(date +%F).json

      - name: Upload dry-import reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: igdb-full-catalogue-dry-import
          path: |
            benchmarks/igdb-dry-import-proposed-*.json
            benchmarks/igdb-dry-import-review-*.json
          if-no-files-found: error
          retention-days: 30
